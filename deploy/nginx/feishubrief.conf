# Install inside the nginx http {} context (e.g. sites-enabled on Debian/Ubuntu).
# Replace example.org and certificate paths before running nginx -t.
# Node serves only the built Console directory and its explicit API routes.
server {
    listen 80;
    listen [::]:80;
    server_name brief.example.org;
    access_log off;
    return 308 https://brief.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brief.example.org;

    ssl_certificate /etc/letsencrypt/live/brief.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brief.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # No access logging of private endpoint URLs. Never enable request-body/header logging.
    access_log off;
    error_log /var/log/nginx/feishubrief-error.log warn;
    server_tokens off;
    client_max_body_size 20m;
    client_body_timeout 30s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # The application supplies the complete path-specific CSP and privacy headers.
    # Do not append another CSP: /app permits only same-origin connections, while
    # /admin additionally permits api.github.com for the existing engine Console.
    # Keep one HSTS header when the application also sends it in production.
    proxy_hide_header Strict-Transport-Security;

    # Console currently uses relative asset URLs. Keep the entry path canonical.
    location = /app/ { return 308 /app; }
    location = /admin/ { return 308 /admin; }

    location / {
        # No URI suffix: preserve /api/member/... and the exact browser Origin.
        proxy_pass http://127.0.0.1:5190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto https;
        # The service currently rate-limits the direct peer; do not trust client IP headers.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
